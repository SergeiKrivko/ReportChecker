<form class="container" [formGroup]="control">
  @switch (sourceInfo?.status) {
    @case ('NotFound') {
      <tui-notification size="l" appearance="negative">
        Источник не найден
      </tui-notification>
    }
    @case ('WrongFormat') {
      <tui-notification size="l" appearance="negative">
        Некорректный формат
      </tui-notification>
    }
    @case ('Success') {
      <tui-notification size="l" appearance="positive">
        Формат: <b>{{ sourceInfo?.format }}</b>
      </tui-notification>
    }
  }
  <div class="grid-container">
    <label tuiLabel>Модель:</label>
    <tui-textfield [stringify]="stringifyModel">
      <input placeholder="По умолчанию" tuiComboBox (blur)="restoreModel()" formControlName="llmModel"/>
      @let models = models$ | async;
      <tui-data-list-wrapper *tuiTextfieldDropdown new
                              [labels]="modelGroupLabels"
                              [items]="models | llmModelGroups | tuiFilterByInput"/>
    </tui-textfield>
    <label tuiLabel>Обработка изображений:</label>
    <tui-textfield [stringify]="stringifyImageProcessingMode">
      <input placeholder="Отключить" tuiSelect formControlName="imageProcessingMode"/>
      <tui-data-list-wrapper *tuiTextfieldDropdown new [items]="imageProcessingModes"/>
    </tui-textfield>
    <label tuiLabel>Уровень рассуждений:</label>
    <tui-textfield [stringify]="stringifyReasoningEffort">
      <input placeholder="По умолчанию" tuiSelect formControlName="reasoningLevel"/>
      <tui-data-list-wrapper *tuiTextfieldDropdown new [items]="reasoningEfforts"/>
    </tui-textfield>
  </div>

  <button tuiButton iconStart="@tui.check" (click)="createReport()" [disabled]="sourceInfo?.status !== 'Success'">
    Создать отчет
  </button>
</form>
