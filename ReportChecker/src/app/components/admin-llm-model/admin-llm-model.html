<form tuiCardLarge tuiAppearance="outline-grayscale" class="container" [formGroup]="control">
  <label tuiLabel>Название:</label>
  <tui-textfield>
    <input tuiTextfield formControlName="displayName">
  </tui-textfield>

  <label tuiLabel>ID модели:</label>
  <tui-textfield>
    <input tuiTextfield formControlName="modelKey">
  </tui-textfield>

  <label tuiLabel>Коэффициент токенов запроса:</label>
  <tui-textfield>
    <input tuiInputNumber formControlName="inputCoefficient">
  </tui-textfield>

  <label tuiLabel>Коэффициент токенов ответа:</label>
  <tui-textfield>
    <input tuiInputNumber formControlName="outputCoefficient">
  </tui-textfield>

  <label tuiLabel>Уровень рассуждений по умолчанию:</label>
  <tui-textfield [stringify]="stringifyReasoningEffort">
    <input tuiSelect formControlName="defaultReasoningLevel"/>
    <tui-data-list-wrapper *tuiTextfieldDropdown new [items]="reasoningEfforts"/>
  </tui-textfield>

  <label class="recommended-container">
    <input tuiCheckbox type="checkbox" formControlName="isRecommended"/>
    Рекомендуемая модель
  </label>
</form>
